name: Release

# Packagist publishes flagbearer/flagbearer from this repository's vX.Y.Z tags,
# so a release is that tag on a commit that passes the tests. Starts only when
# you run it from the Actions tab, on main. A version that's already tagged is
# skipped, so bump Version::VERSION to release.
on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.5"
          extensions: curl, mbstring
          tools: composer
      - run: composer validate --strict --no-check-publish
      - run: composer install --quiet --no-interaction && vendor/bin/phpunit && vendor/bin/phpstan analyse
      - id: version
        run: echo "tag=v$(sed -nE "s/.*VERSION = '(.*)';/\1/p" src/Version.php)" >> "$GITHUB_OUTPUT"

  tag:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Tag the release
        env:
          TAG: ${{ needs.test.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "$TAG already exists"
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
